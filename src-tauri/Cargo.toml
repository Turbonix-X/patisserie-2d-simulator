[package]
name = "p2ds"
version = "1.2.4"
description = "Pâtisserie 2D Simulator"
authors = ["Turbonix Entertainment"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "p2ds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
