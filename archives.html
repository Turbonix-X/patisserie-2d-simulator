<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>P2DS - Archives</title>
  <meta name="description" content="Toutes les anciennes versions de Pâtisserie 2D Simulator.">
  <link rel="icon" href="favicon.png">
  <script>
    // Le même thème que le jeu (clair, sombre ou automatique), appliqué avant l'affichage
    (function () {
      var theme = "light";
      try {
        var pref = localStorage.getItem("p2ds_home_theme");
        theme = pref === "dark" || (pref === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="turbonix.css?v=3.40">
  <link rel="stylesheet" href="style.css?v=3.40">
  <style>
    .arch-badge { display: inline-block; margin: 6px 0 14px; padding: 3px 14px; border-radius: 99px; background: linear-gradient(135deg, #FFD700, #FFB300); color: #3E2723; font-size: .8rem; font-weight: 900; letter-spacing: .14em; }
    .arch-center { width: min(960px, 100%); }
    .arch-grid { display: grid; grid-template-columns: repeat(5, 168px); gap: 10px; justify-content: center; width: 100%; }
    .arch-tile { min-height: 110px; padding: 14px 10px; border-radius: 18px; border: 1px solid var(--border); background: var(--surface); color: var(--text); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; font: inherit; cursor: pointer; transition: transform .2s ease, box-shadow .2s, border-color .2s; }
    .arch-tile:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.18); border-color: #FFB300; }
    .arch-tile b { font-size: 1.02rem; overflow-wrap: anywhere; }
    .arch-tile small { opacity: .75; font-size: .8rem; }
    @media (max-width: 960px) { .arch-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
    :root[data-theme="dark"] .arch-tile { color: var(--text); }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>
  <div class="home" id="home" style="display:flex">
    <div class="home-top">
      <a class="hbtn" id="back" href="./" title="Retour au jeu" aria-label="Retour au jeu"><svg class="uii" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    </div>
    <div class="home-center arch-center">
      <img class="home-logo small" src="logo.svg" alt="" width="64" height="64">
      <h1 class="game-name home-name">P2DS</h1>
      <span class="arch-badge">ARCHIVES</span>
      <div class="arch-grid" id="grid"></div>
      <p class="home-empty" id="empty" style="display:none"></p>
    </div>
    <footer class="home-footer" id="foot"></footer>
  </div>
<script>
(function() {
  var lang = String(navigator.language || 'fr').slice(0, 2);
  var fr = lang === 'fr';
  var back = document.getElementById('back');
  back.title = back.ariaLabel = fr ? 'Retour au jeu' : 'Back to the game';
  document.documentElement.lang = fr ? 'fr' : 'en';
  document.title = 'P2DS - Archives';
  document.getElementById('foot').textContent = new Date().getFullYear() + (fr ? ' Turbonix Entertainment. Tous droits réservés. Icônes : Twemoji (CC-BY 4.0).' : ' Turbonix Entertainment. All rights reserved. Icons: Twemoji (CC-BY 4.0).');
  function esc(s) { return String(s).replace(/[&<>"]/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function day(iso) {
    var d = new Date(iso + 'T12:00:00');
    try { return d.toLocaleDateString(fr ? 'fr-FR' : lang, { day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return iso; }
  }
  fetch('archives.json', { cache: 'no-cache' }).then(function(r) { return r.json(); }).then(function(list) {
    var g = document.getElementById('grid');
    if (!list.length) { var e = document.getElementById('empty'); e.style.display = 'block'; e.textContent = fr ? 'Aucune version pour l\'instant.' : 'No version yet.'; return; }
    g.innerHTML = list.map(function(v) {
      var ok = /^https:\/\//.test(v.url) ? v.url : '#';
      return '<button class="arch-tile" onclick="location.href=\'' + esc(ok) + '\'"><b>' + esc(v.name) + '</b><small>' + esc(day(v.date)) + '</small></button>';
    }).join('');
  }, function() { var e = document.getElementById('empty'); e.style.display = 'block'; e.textContent = '—'; });
})();
</script>
</body>
</html>
