  <meta property="og:title" content="Pâtisserie 2D Simulator">

  <script>
    // Applique le thème avant l'affichage pour éviter un flash
    (function () {
      var theme = "light";
      try {
        var save = JSON.parse(localStorage.getItem("p2ds_save"));
        if (save && save.settings && save.settings.theme) theme = save.bakeryTheme || save.settings.theme;
      } catch (e) {}
      document.documentElement.dataset.theme = theme;
    })();
  </script>
