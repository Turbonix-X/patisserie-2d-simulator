<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pâtisserie 2D Simulator — Turbonix</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <script>
    // Applique le thème avant l'affichage pour éviter un flash
    (function () {
      var theme = "light";
      try {
        var save = JSON.parse(localStorage.getItem("p2ds_save"));
        if (save && save.settings && save.settings.theme) theme = save.settings.theme;
      } catch (e) {}
      document.documentElement.dataset.theme = (theme === "dark" || theme === "espace") ? "dark" : "light";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="turbonix.css?v=1.4.1">
  <link rel="stylesheet" href="style.css?v=1.4.1">
</head>
<body>
  <div class="bg-blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- Header -->
  <div id="header"></div>

  <!-- Rebirth banner (shown/hidden by JS) -->
  <div id="rebirth-banner"></div>

  <!-- Tab navigation -->
  <nav id="tabs"></nav>

  <!-- Main game area -->
  <main id="game-area">
    <!-- Left: Ingredients -->
    <div id="ingredients"></div>

    <!-- Right: Active tab content -->
    <div id="main-panel"></div>
  </main>

  <!-- Bottom bar: space + crafting progress -->
  <div id="dock">
    <div id="space-bar"></div>
    <div id="crafting-bar"></div>
  </div>

  <!-- Toast notifications -->
  <div id="toast-area" role="status" aria-live="polite"></div>

  <!-- Tutorial overlay -->
  <div id="tutorial-overlay" style="display:none"></div>

  <!-- Modal container -->
  <div id="modal-overlay" class="modal-overlay" style="display:none"></div>

  <!-- Console button (bottom-right, shown when cheat unlocked) -->
  <div id="console-btn-wrap" style="display:none"></div>

  <!-- Background music -->
  <audio id="bg-music" loop preload="none"></audio>

  <!-- Footer -->
  <footer id="game-footer" class="site-footer">
    <span id="year"></span> Turbonix Entertainment. Tous droits réservés.
    Icônes : <a href="https://github.com/jdecked/twemoji" target="_blank" rel="noopener">Twemoji</a> (CC-BY 4.0).
  </footer>
  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>

  <!-- Game scripts (order matters) -->
  <script src="JS/GameData.js?v=1.4.1"></script>
  <script src="JS/Icons.js?v=1.4.1"></script>
  <script src="JS/Languages.js?v=1.4.1"></script>
  <script src="JS/PlayerData.js?v=1.4.1"></script>
  <script src="JS/Logic.js?v=1.4.1"></script>
  <script src="JS/Interface.js?v=1.4.1"></script>
  <script src="JS/main.js?v=1.4.1"></script>

</body>
</html>
