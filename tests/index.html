<script>
currentLang = 'fr';
var results = [];
function check(name, ok, detail) { results.push({ name: name, ok: !!ok, detail: detail || '' }); }

var ingBy = {};
ING.forEach(function(i) { ingBy[i.id] = i; });
function cost(r) { var c = 0; for (var k in r.req) c += ingBy[k].cost * r.req[k]; return c; }

// --- Economie ---
var lossy = REC.filter(function(r) { return r.val * r.qty <= cost(r); }).map(function(r) { return r.id; });
check('Toutes les recettes sont rentables', lossy.length === 0, lossy.join(', '));
var resale = REC.filter(function(r) { return r.val * r.qty <= cost(r) * 0.5; }).map(function(r) { return r.id; });
check('Cuisiner rapporte plus que revendre les ingredients', resale.length === 0, resale.join(', '));
var late = [];
REC.forEach(function(r) { for (var k in r.req) { if (ingBy[k].unlockLvl > r.unlockLvl) late.push(r.id + ':' + k); } });
check('Aucune recette ne demande un ingredient encore verrouille', late.length === 0, late.join(', '));
var unused = ING.filter(function(i) { return !REC.some(function(r) { return r.req[i.id]; }) && !ING.some(function(o) { return o.craftReq && o.craftReq[i.id]; }); }).map(function(i) { return i.id; });
check('Chaque ingredient sert a quelque chose', unused.length === 0, unused.join(', '));
var noBld = ING.filter(function(i) { return !BUILDINGS.some(function(b) { return b.produces === i.id; }); }).map(function(i) { return i.id; });
check('Chaque ingredient a un batiment', noBld.length === 0, noBld.join(', '));
var early = BUILDINGS.filter(function(b) { return b.unlockLvl < ingBy[b.produces].unlockLvl; }).map(function(b) { return b.id; });
check('Aucun batiment avant son ingredient', early.length === 0, early.join(', '));
var badCraft = ING.filter(function(i) { if (!i.craftable) return false; var c = 0; for (var k in i.craftReq) c += ingBy[k].cost * i.craftReq[k]; return c / i.craftQty >= i.cost; }).map(function(i) { return i.id; });
check('Fabriquer coute moins cher qu acheter', badCraft.length === 0, badCraft.join(', '));

// --- Progression ---
var total = 0;
var slow = [];
for (var l = 1; l < 1000; l++) {
  var need = xpForLevel(l);
  total += need;
  // La meilleure recette disponible : combien de fournees pour un niveau ?
  var best = 0;
  REC.forEach(function(r) { if (r.unlockLvl <= l) best = Math.max(best, r.xp + 0.3 * r.val * r.qty); });
  if (need / best > 60) slow.push(l + ':' + Math.round(need / best));
}
check('Un niveau ne demande jamais plus de 60 fournees', slow.length === 0, slow.slice(0, 8).join(', '));
check('La courbe d XP monte toujours', (function() { for (var l = 1; l < 1000; l++) { if (xpForLevel(l + 1) < xpForLevel(l)) return false; } return true; })());

// --- Argent infini ---
function roundTrip(setup, ingId) {
  G = createFreshState();
  G.money = 100000;
  setup();
  var start = G.money, ing = findIng(ingId);
  for (var i = 0; i < 100; i++) { buyIngredient(ing, '1'); resellIngredient(ing, G.ing[ingId]); }
  return G.money - start;
}
check('Acheter puis revendre perd de l argent', roundTrip(function() {}, 'farine') < 0);
check('... pendant le Rush sucre aussi', roundTrip(function() { G.eventClickBonus = 2; }, 'farine') < 0);
check('... avec le bonus d anniversaire aussi', roundTrip(function() { G.birthdayBoostUntil = Date.now() + 1e6; }, 'oeuf') < 0);
check('... pendant les soldes aussi', roundTrip(function() { G.eventIngBonus = -0.3; }, 'farine') < 0);
G = createFreshState(); G.money = 1e7; G.level = 200;
var m0 = G.money;
for (var b = 0; b < 5; b++) { openNewBakery(); sellBakery(G.bakeries.length - 1); }
check('Acheter puis revendre une patisserie perd de l argent', G.money < m0);

// --- Prix ---
G = createFreshState();
G.soldCount.cookie = 100000; G.totalAllSold = 100000;
check('Un prix ne tombe jamais a 0', inflatedPrice(findRec('cookie')) > 0, inflatedPrice(findRec('cookie')));
G = createFreshState();
var one = batchPrice(findRec('cookie'), 1), many = batchPrice(findRec('cookie'), 1000);
check('Vendre en gros fait baisser le prix', many < one * 1000);
G = createFreshState();
G.soldCount.cookie = 100; G.totalAllSold = 100;
recoverDemand(3600);
check('La demande revient avec le temps', G.soldCount.cookie < 10, G.soldCount.cookie);

// --- Affichage de l argent et du temps ---
G = createFreshState();
check('0,80 EUR s affiche', fmtMoney(0.8) === '0,80\u20ac', fmtMoney(0.8));
check('50 EUR s affiche sans centimes', fmtMoney(50) === '50\u20ac', fmtMoney(50));
check('Le temps n affiche jamais 60s', fmtTime(119.6) === '2m0s' && fmtTime(59.5) === '1m0s' && fmtTime(3599.7) === '1h0m', [fmtTime(119.6), fmtTime(59.5), fmtTime(3599.7)].join(' '));

// --- Espace et fours ---
G = createFreshState();
G.ing.farine = 100; G.ing.sucre = 100; G.ing.oeuf = 100;
var c1 = startCraft(findRec('cookie')), c2 = startCraft(findRec('cookie'));
check('Une 2e fournee qui ne rentre pas se lance quand meme (sa barre gele)', c1 && c2 && G.crafting.length === 2);
G = createFreshState(); G.maxSpace = 1000; G.ovens = 2;
G.ing.farine = 100; G.ing.sucre = 100; G.ing.oeuf = 100;
for (var c = 0; c < 4; c++) startCraft(findRec('cookie'));
check('Les fours limitent les preparations', activeCrafts() === 2 && G.crafting.length === 4, activeCrafts());

// --- Moral ---
G = createFreshState(); G.money = 1e9; G.level = 50;
hireEmployee('collector');
var solo = moraleDecay();
hireEmployee('collector'); hireEmployee('collector');
check('Plus il y a d employes, plus le moral descend lentement', moraleDecay() < solo);
G.employees[0].morale = 50;
tickEmployees(100);
check('Le moral descend tout seul', G.employees[0].morale < 50, G.employees[0].morale);
G.employees[0].morale = 9.5;
var before2 = G.employees.length;
tickEmployees(1);
check('Moral trop bas : il demissionne', G.employees.length === before2 - 1);
G = createFreshState(); G.money = 1e9; G.level = 50;
hireEmployee('collector'); hireEmployee('manager');
G.employees[0].morale = 50;
tickEmployees(10);
check('Un manager remonte le moral', G.employees[0].morale > 50, G.employees[0].morale);

// --- Employes ---
G = createFreshState(); G.money = 1e12; G.level = 100;
check('Vendeur au niveau 35 et chef patissier au niveau 65', findEmpType('seller').unlockLvl === 35 && findEmpType('chef').unlockLvl === 65);
hireEmployee('collector');
var e0 = G.employees[0], p1 = empPower(e0), c1 = getTrainCost(e0);
trainEmployee(e0.id);
check('Former double la capacite, et coute cher', empPower(e0) === p1 * 2 && getTrainCost(e0) === c1 * 8);
check('En formation, il ne travaille pas', empTraining(e0) && !empWorking(e0));
G.money = 1e15;
for (var ti = 0; ti < 14; ti++) { e0.trainingUntil = 0; trainEmployee(e0.id); }
e0.trainingUntil = 0;
check('10 niveaux au maximum', e0.level === EMP_MAX_LVL && EMP_MAX_LVL === 10 && trainEmployee(e0.id) === false, e0.level);
G = createFreshState(); G.money = 1e6; G.level = 100;
G.applicants = []; hireEmployee('novice');
var nov = G.employees[0];
check('Un employe sans metier ne produit rien', autoRate('farine') === 0);
check('On peut lui payer un metier', giveJob(nov.id, 'collector') && nov.type === 'collector' && G.money < 1e6);
G = createFreshState(); G.level = 5;
var lowChance = applicantChance(), lowSearch = searchChance();
G.level = 200;
check('Les candidats viennent plus souvent a haut niveau', applicantChance() > lowChance && searchChance() > lowSearch);
check('Chercher un metier prend du temps', startSearch('seller') && G.searches.length === 1 && G.searches[0].doneAt > Date.now() && startSearch('seller') === false);
G = createFreshState(); G.money = 1e9; G.level = 100; G.maxSpace = 1000;
hireEmployee('seller');
var v1 = sellerRate(G.employees[0]);
hireEmployee('seller'); hireEmployee('seller');
check('Plus de vendeurs, ca vend plus vite', sellerRate(G.employees[0]) > v1 && v1 < 0.2, v1);
G.cakes.cookie = 10; G.stats.cakesMadeById.cookie = 10; G.employees[0].sellPct = 50;
check('Le vendeur respecte son pourcentage', sellerAllowance(G.employees[0], findRec('cookie')) === 5);
G.employees[0].sellPct = 100;
hireEmployee('maitre');
G.orders = [{ id: 1, name: 'A', items: [{ recId: 'cookie', qty: 4 }], base: 1, reward: 2, duration: 100, expiresAt: Date.now() + 1e6 }];
check('Avec un maitre d hotel, les commandes passent d abord', sellerAllowance(G.employees[0], findRec('cookie')) === 6);
G = createFreshState(); G.money = 1e9; G.level = 100; G.maxSpace = 1000;
G.ing.farine = 100; G.ing.sucre = 100; G.ing.oeuf = 100;
hireEmployee('chef');
tickChefs(60);
check('Le chef patissier prepare tout seul', G.crafting.length === 1, G.crafting.length);
var chef = G.employees[0];
chef.chefMode = 'only'; chef.chefList = ['cake']; G.crafting = []; chef.chefCd = 99;
tickChefs(1);
check('... seulement les recettes choisies', G.crafting.length === 1 && G.crafting[0].recId === 'cake', G.crafting[0] && G.crafting[0].recId);
G.crafting = []; chef.chefMode = 'priority'; chef.chefList = ['cookie']; chef.chefCd = 99;
tickChefs(1);
check('... ou d abord celles que tu preferes', G.crafting[0].recId === 'cookie');
G = createFreshState(); G.money = 1e6; G.level = 100;
hireEmployee('buyer'); G.employees[0].buyCd = 99;
var mBefore = G.money;
tickBuyers(1);
check('L intendant achete ce qui manque, avec un delai', G.deliveries.length === 1 && G.money < mBefore && G.ing.farine === 0, G.deliveries.length);
G = createFreshState(); G.money = 1e9; G.level = 100;
hireEmployee('collector'); hireEmployee('manager');
var mgr = G.employees[1];
mgr.mgrAuto = true; mgr.mgrMin = 50; mgr.mgrCd = 99;
G.applicants = [{ id: 1, name: 'A', type: 'collector', skill: 20, hireCost: 100, expiresAt: Date.now() + 1e6 }, { id: 2, name: 'B', type: 'collector', skill: 60, hireCost: 300, expiresAt: Date.now() + 1e6 }, { id: 3, name: 'C', type: 'collector', skill: 70, hireCost: 500, expiresAt: Date.now() + 1e6 }];
tickManagers(1);
check('Le manager embauche le moins cher au niveau demande', G.employees.length === 3 && G.employees[2].name === 'B', G.employees.length);
check('... et l envoie sur l ingredient le moins produit', G.employees[2].assignedIng !== G.employees[0].assignedIng, G.employees[2].assignedIng);

// --- Deblocages ---
G = createFreshState();
check('Deux recettes au depart', REC.filter(recUnlocked).length === 2);
G.level = 2;
var butter = findIng('beurre');
check('Il faut cliquer pour debloquer un ingredient', !ingUnlocked(butter) && startUnlock('ing', butter));
check('... et attendre', !ingUnlocked(butter) && unlockPending('ing', butter) > Date.now());
G.unlocks.pending['ing:beurre'] = 1;
tickUnlocks();
check('... puis il arrive', ingUnlocked(butter));
check('Pas avant le bon niveau', startUnlock('ing', findIng('infinipur')) === false);
G = createFreshState(); G.level = 500;
check('Une recette pas debloquee ne se prepare pas', !canMake(findRec('madel')));

// --- Vendre ---
G = createFreshState(); G.cakes.cookie = 5;
var saleTotal = queueSale([{ rec: findRec('cookie'), qty: 5 }]);
check('Vendre prend un petit moment', saleTotal > 0 && G.cakes.cookie === 0 && G.money === 50 && G.sales.length === 1);
G.sales[0].at = 1;
check('... puis l argent arrive', tickSales() === saleTotal && G.money === 50 + saleTotal);

// --- Batiments ---
G = createFreshState(); G.level = 40; G.money = 1e9;
var firstBld = BUILDINGS[0];
buyBuilding(firstBld, '1');
check('Un batiment ne produit rien a la seconde', autoRate(firstBld.produces) === 0);
var ingStart = G.ing[firstBld.produces];
advanceBuildings(100);
check('Il attend sa livraison', G.ing[firstBld.produces] === ingStart);
advanceBuildings(BLD_CYCLE_SEC);
check('Puis il livre une enorme quantite d un coup', G.ing[firstBld.produces] >= firstBld.baseRate * BLD_CYCLE_SEC, G.ing[firstBld.produces]);

// --- Plus de rebirth ---
check('Les rebirths sont retires', typeof doRebirth === 'undefined' && typeof REBIRTHS === 'undefined' && typeof rebirthBonus === 'undefined');
G = createFreshState(); G.rebirth = 7;
var sv0 = sellValueMult(); G.rebirth = 0;
check('Un ancien rebirth ne change plus les prix', sellValueMult() === sv0);

// --- Succes ---
var ids = {}, dup = [];
ACHIEVEMENTS.forEach(function(a) { if (ids[a.id]) dup.push(a.id); ids[a.id] = 1; });
check('Aucun succes en double', dup.length === 0, dup.join(', '));
check('Exactement 1000 succes visibles', ACHIEVEMENTS.filter(function(a) { return !a.hidden; }).length === 1000, ACHIEVEMENTS.length);
check('Exactement 5 succes secrets', ACHIEVEMENTS.filter(function(a) { return a.hidden; }).length === 5);
G = createFreshState();
var noName = ACHIEVEMENTS.filter(function(a) { return !achName(a) || !achDesc(a) || achName(a).indexOf('r.') === 0; }).map(function(a) { return a.id; });
check('Chaque succes a un nom et une description', noName.length === 0, noName.slice(0, 8).join(', '));
var badCat = ACHIEVEMENTS.filter(function(a) { return ACH_CATEGORIES.indexOf(a.cat) < 0; }).map(function(a) { return a.id; });
check('Chaque succes a une categorie', badCat.length === 0, badCat.join(', '));

// --- Textes ---
var missing = [];
['fr', 'en', 'es', 'pt', 'de', 'ar', 'zh', 'ja', 'ko', 'ru'].forEach(function(lang) {
  ING.forEach(function(i) { if (!LANGS[lang]['i.' + i.id]) missing.push(lang + ':i.' + i.id); });
  REC.forEach(function(r) { if (!LANGS[lang]['r.' + r.id]) missing.push(lang + ':r.' + r.id); });
  BUILDINGS.forEach(function(b) { if (!LANGS[lang]['b.' + b.id]) missing.push(lang + ':b.' + b.id); });
  EVENT_TYPES.forEach(function(e) { if (!LANGS[lang]['event.' + e.id]) missing.push(lang + ':event.' + e.id); });
  INVISIBLE_EVENTS.forEach(function(e) { if (!LANGS[lang]['inv.' + e.id]) missing.push(lang + ':inv.' + e.id); });
  THEME_LIST.forEach(function(th) { if (!LANGS[lang][th.langKey]) missing.push(lang + ':' + th.langKey); });
});
var onlyOne = Object.keys(LANGS.fr).filter(function(k) { return !LANGS.en[k]; }).concat(Object.keys(LANGS.en).filter(function(k) { return !LANGS.fr[k]; }));
check('Tous les noms sont traduits', missing.length === 0, missing.slice(0, 8).join(', '));
check('Le francais et l anglais ont les memes textes', onlyOne.length === 0, onlyOne.slice(0, 8).join(', '));
var esDiff = Object.keys(LANGS.fr).filter(function(k) { return !LANGS.es[k]; }).concat(Object.keys(LANGS.es).filter(function(k) { return !LANGS.fr[k]; }));
check('L espagnol a tous les textes', esDiff.length === 0, esDiff.slice(0, 12).join(', '));
var paramsBad = Object.keys(LANGS.es).filter(function(k) {
  function p(x) { return (String(x).match(/\{\{\w+\}\}/g) || []).sort().join(); }
  return LANGS.en[k] && p(LANGS.es[k]) !== p(LANGS.en[k]);
});
check('L espagnol garde les memes valeurs a remplacer', paramsBad.length === 0, paramsBad.slice(0, 8).join(', '));
currentLang = 'es';
var esNames = ACHIEVEMENTS.filter(function(a) { return !a.nameFn && !achNameEs(a.en); }).map(function(a) { return a.en; });
var esDescs = ACHIEVEMENTS.filter(function(a) { return !a.descFn && !achDescEs(a.descEn); }).map(function(a) { return a.descEn; });
check('Tous les succes ont un nom en espagnol', esNames.length === 0, esNames.slice(0, 8).join(', '));
check('Tous les succes ont une description en espagnol', esDescs.length === 0, esDescs.slice(0, 8).join(', '));
currentLang = 'fr';
['pt', 'de', 'ar', 'zh', 'ja', 'ko', 'ru'].forEach(function(lang) {
  var diff = Object.keys(LANGS.fr).filter(function(k) { return !LANGS[lang][k]; }).concat(Object.keys(LANGS[lang]).filter(function(k) { return !LANGS.fr[k]; }));
  check(lang + ' : tous les textes', diff.length === 0, diff.slice(0, 12).join(', '));
  var bad = Object.keys(LANGS[lang]).filter(function(k) {
    function p(x) { return (String(x).match(/\{\{\w+\}\}/g) || []).sort().join(); }
    return LANGS.en[k] && p(LANGS[lang][k]) !== p(LANGS.en[k]);
  });
  check(lang + ' : les memes valeurs a remplacer', bad.length === 0, bad.slice(0, 8).join(', '));
  var names = ACHIEVEMENTS.filter(function(a) { return !a.nameFn && !extraAchName(lang, a.en); }).map(function(a) { return a.en; });
  var descs = ACHIEVEMENTS.filter(function(a) { return !a.descFn && !extraAchDesc(lang, a.descEn); }).map(function(a) { return a.descEn; });
  check(lang + ' : le nom de tous les succes', names.length === 0, names.slice(0, 8).join(', '));
  check(lang + ' : la description de tous les succes', descs.length === 0, descs.slice(0, 8).join(', '));
  check(lang + ' : chaque ingredient, recette et batiment a un nom', ING.concat(REC).concat(BUILDINGS).every(function(x) { return LANGS[lang]['i.' + x.id] || LANGS[lang]['r.' + x.id] || LANGS[lang]['b.' + x.id]; }));
  check(lang + ' : des noms d employes et de patisseries', EMP_NAMES_LANG[lang].length === EMP_NAMES_LANG.fr.length && BAKERY_NAMES_LANG[lang].length === BAKERY_NAMES_LANG.fr.length);
  var sameCount = Object.keys(LANGS[lang]).filter(function(k) { return /\|/.test(LANGS.fr[k] || '') && /^(bob|pause)\./.test(k) && !LANGS[lang][k]; });
  check(lang + ' : Bob a ses repliques', sameCount.length === 0, sameCount.join(', '));
});

// --- Themes de la Beta 1.5 ---
G = createFreshState(); G.level = 99;
check('La Boulangerie est bloquee avant le niveau 100', themeLockReason(findTheme('bakery')) === 'level');
G.level = 100;
check('La Boulangerie arrive au niveau 100', themeLockReason(findTheme('bakery')) === null);
G = createFreshState(); G.creative = true;
var lockedInCreative = THEME_LIST.filter(function(th) { return themeLockReason(th); }).map(function(th) { return th.id; });
check('En creatif, tous les themes sont debloques', lockedInCreative.length === 0, lockedInCreative.join(', '));
check('Le theme Cubes est retire', !findTheme('cubes'));
G = createFreshState(); G.settings.theme = 'cubes'; enforceThemeLocks();
check('Une partie restee sur Cubes revient au theme clair', G.settings.theme === 'light');

// --- Beta 1.6 ---
var ingIcons = {}, dupIng = [];
ING.forEach(function(i) { if (ingIcons[i.e]) dupIng.push(ingIcons[i.e] + '/' + i.id); ingIcons[i.e] = i.id; });
check('Chaque ingredient a sa propre icone', dupIng.length === 0, dupIng.join(', '));
check('Les oeufs coutent un tout petit peu moins', findIng('oeuf').cost === 0.28);
G = createFreshState(); G.money = 1000;
var pe = { id: 1, type: 'seller', status: 'working', level: 1, skill: 50, morale: 100 };
G.employees.push(pe);
check('Un employe travaille', empWorking(pe));
pe.paused = true;
check('En pause, il ne travaille plus', !empWorking(pe) && empCount('seller') === 0);
var m0 = G.money; tickEmployees(10);
check('En pause, il est toujours paye', G.money < m0, m0 - G.money);
G = createFreshState(); G.infiniteMoney = true; G.infiniteIng = { farine: true }; G.money = 5; G.ing.farine = 0;
tickInfinite();
check('Argent et ingredient a l infini', G.money === MONEY_CAP && G.ing.farine >= 1e300 && G.ing.sucre === createFreshState().ing.sucre);

// --- Beta 1.7 ---
G = createFreshState();
